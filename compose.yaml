# Stack lokal: Postgres + migrasi (one-shot) + API + worker.
# Jalankan: cp .env.example .env  lalu  docker compose up -d --build
#
# File .env dipakai dua kali: oleh Compose untuk interpolasi variabel di bawah,
# dan sebagai env_file di container. `environment` menimpa nilai env_file, jadi
# DATABASE_URL di container selalu memakai host `db`, bukan `localhost`.

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-backendlab}

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-backendlab}?sslmode=disable

services:
  db:
    image: postgres:17-alpine
    environment: *db-env
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      # 5434 supaya tidak bentrok dengan PostgreSQL lokal di 5432.
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-backendlab}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    env_file: .env
    environment:
      <<: *app-env
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
    command:
      - sh
      - -c
      - |
        set -eu
        /usr/local/bin/migrate up
        /usr/local/bin/migrate seed-prompts
        if [ -n "${BOOTSTRAP_ADMIN_EMAIL:-}" ]; then
          /usr/local/bin/migrate bootstrap-admin --email="${BOOTSTRAP_ADMIN_EMAIL:-}"
        fi
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    env_file: .env
    environment:
      <<: *app-env
      PORT: "8080"
    ports:
      # 18080 supaya tidak bentrok dengan proses lokal yang memakai 8080.
      - "127.0.0.1:${API_PORT:-18080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    build: .
    command: ["worker"]
    env_file: .env
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Tempat frontend nanti (saat sudah ada di repo ini):
  # web:
  #   build: ./web
  #   depends_on:
  #     api:
  #       condition: service_healthy
  #   ports:
  #     - "127.0.0.1:5173:5173"
  # Tambahkan http://localhost:5173 ke CORS_ALLOWED_ORIGINS di .env.

volumes:
  dbdata:
